workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Tower Dash Bricks code magic

    environment:
      vars:
        BUNDLE_ID: "com.towerlab.tower.dash.bricks"
        XCODE_SCHEME: "TowerDashBricks"
        XCODE_PROJECT: "TowerDashBricks.xcodeproj"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up code signing (auto-create cert & profile)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
