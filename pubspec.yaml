name: tower_dash_bricks
description: "TowerDash Bricks – Rush to stack 'em all!"
publish_to: 'none'
version: 1.0.2+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Game ──────────────────────────────────────────────────
  google_fonts: ^8.1.0
  audioplayers: ^6.6.0

  # ── Loading screen video ──────────────────────────────────
  video_player: ^2.11.1

  # ── Gray gate layer ───────────────────────────────────────
  # Versions differ from LavaPeakRun (^6.16.2) and StackoTower (^6.17.1)
  # to prevent binary fingerprinting across portfolio apps.
  appsflyer_sdk: ^6.17.2
  app_tracking_transparency: 2.0.6
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.6
  firebase_app_check: ^0.3.2+8
  flutter_local_notifications: ^18.0.0
  connectivity_plus: ^6.1.5
  http: ^1.5.1
  device_info_plus: ^11.5.0
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.4
  webview_flutter_wkwebview: ^3.22.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  # Disable Swift Package Manager — Firebase managed via CocoaPods
  # to prevent module conflicts with flutter_local_notifications.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/tdb_icon.webp
    - assets/tdb_name.webp
    - assets/gameplay/
    - assets/boot/
    - assets/notice/
    - assets/netdrop/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/tdb_icon.webp"
  remove_alpha_ios: true
  background_color_ios: "#0D1B2A"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/tdb_icon.webp"
